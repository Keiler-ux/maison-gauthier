<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda - La Maison Gauthier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #FCFCFC 0%, #F8F8F8 100%);
            color: #1A1A1A;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .calendar-day {
            aspect-ratio: 1;
            border-radius: 12px;
            border: 1px solid #E5E7EB;
            background: white;
            padding: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .calendar-day:hover {
            border-color: #3B82F6;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.1);
            transform: translateY(-2px);
        }

        .calendar-day.other-month {
            background: #F9FAFB;
            color: #D1D5DB;
        }

        .calendar-day.today {
            background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
            border-color: #2563EB;
            color: white;
            font-weight: 600;
        }

        .calendar-day.selected {
            background: #DBEAFE;
            border-color: #3B82F6;
        }

        .event-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            display: inline-block;
            margin: 0 2px;
        }

        .day-number {
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 14px;
        }

        .event-indicator {
            font-size: 10px;
            margin-top: 2px;
        }

        .modal-backdrop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 40;
        }

        .modal-backdrop.active {
            display: block;
            overflow: hidden;
        }

        body.modal-open {
            overflow: hidden;
        }

        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 16px;
            padding: 24px;
            z-index: 50;
            width: 90%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .modal.active {
            display: block;
        }

        .event-item {
            padding: 12px;
            background: #F3F4F6;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #3B82F6;
        }

        .event-item.type-anniversary {
            border-left-color: #EC4899;
        }

        .event-item.type-lunch {
            border-left-color: #F59E0B;
        }

        .event-item.type-trip {
            border-left-color: #10B981;
        }

        .week-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 8px;
        }

        .week-day-header {
            text-align: center;
            font-weight: 600;
            font-size: 12px;
            color: #6B7280;
            padding: 8px 0;
        }

        .calendar-week {
            display: grid;
            grid-template-columns: 50px repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 8px;
        }

        .week-number {
            text-align: center;
            font-size: 11px;
            color: #9CA3AF;
            padding: 8px 0;
            font-weight: 600;
        }

        .calendar-day-week {
            aspect-ratio: auto;
            min-height: 120px;
            border-radius: 8px;
            border: 1px solid #E5E7EB;
            background: white;
            padding: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            overflow: hidden;
        }

        .calendar-day-week:hover {
            border-color: #3B82F6;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.1);
        }

        .calendar-day-week.other-month {
            background: #F9FAFB;
        }

        .calendar-day-week.today {
            border-color: #3B82F6;
        }

        .event-tag {
            display: inline-block;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 2px;
            margin-right: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: #EFF6FF;
            color: #1E40AF;
            border: 0.5px solid #BFDBFE;
        }

        .event-tag.multi-day {
            background: #FEF3C7;
            color: #92400E;
            border: 0.5px solid #FCD34D;
        }

        .view-toggle {
            display: flex;
            gap: 8px;
        }

        .view-toggle button {
            padding: 6px 12px;
            border: 1px solid #E5E7EB;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .view-toggle button.active {
            background: #3B82F6;
            color: white;
            border-color: #3B82F6;
        }

        /* Optimisation pour mobile (iPhone) */
        @media (max-width: 640px) {
            body {
                padding: 0;
                margin: 0;
            }

            main {
                padding-top: 80px;
                padding-bottom: 20px;
                padding-left: 8px;
                padding-right: 8px;
                margin: 0;
            }

            /* Conteneur calendrier */
            .bg-white.rounded-2xl.shadow-lg {
                padding: 12px !important;
                border-radius: 12px;
            }

            .overflow-x-auto {
                -webkit-overflow-scrolling: touch;
            }

            /* En-têtes */
            h1 {
                font-size: 28px !important;
                margin-bottom: 8px;
                line-height: 1.2;
            }

            h2 {
                font-size: 20px !important;
            }

            h3 {
                font-size: 16px !important;
            }

            p {
                font-size: 13px !important;
            }

            /* Calendrier */
            .calendar-grid {
                gap: 2px;
                grid-template-columns: repeat(7, 1fr);
            }

            .calendar-day {
                aspect-ratio: 1;
                padding: 4px;
                border-radius: 8px;
                font-size: 11px;
            }

            .day-number {
                font-size: 12px;
                margin-bottom: 2px;
            }

            .event-tag {
                font-size: 9px;
                padding: 1px 4px;
                margin-bottom: 1px;
                margin-right: 1px;
                display: block;
                max-width: 100%;
                width: 100%;
                white-space: normal;
                text-overflow: clip;
                overflow: hidden;
            }

            .event-indicator {
                font-size: 9px;
                line-height: 1.1;
            }

            /* Forcer une colonne sur mobile */
            .lg\\:col-span-3,
            .lg\\:col-span-1 {
                grid-column: auto !important;
            }

            /* Calendrier hebdomadaire */
            .calendar-week {
                grid-template-columns: repeat(7, 1fr);
                gap: 2px;
            }

            .calendar-day-week {
                min-height: 80px;
                padding: 4px;
                font-size: 11px;
            }

            .week-day-header {
                font-size: 10px;
                padding: 6px 0;
            }

            /* Modal */
            .modal {
                width: 95%;
                max-width: 100%;
                max-height: 80vh;
                padding: 12px;
                border-radius: 12px;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
                top: 50% !important;
                left: 50% !important;
                top: auto !important;
                bottom: auto !important;
                transform: translate(-50%, -50%) !important;
            }

            .modal form {
                font-size: 14px;
            }

            .modal input,
            .modal select,
            .modal textarea {
                font-size: 16px;
                padding: 8px !important;
                border-radius: 6px;
            }

            .modal label {
                font-size: 12px !important;
                margin-bottom: 4px !important;
            }

            .modal div {
                margin-bottom: 8px !important;
            }

            .modal .space-y-4 {
                gap: 8px !important;
            }

            .modal form > div {
                margin-bottom: 6px !important;
            }

            /* Titre du modal réduit */
            .modal .flex.justify-between {
                margin-bottom: 12px !important;
            }

            .modal .text-2xl {
                font-size: 16px !important;
            }

            .modal button {
                font-size: 12px;
                padding: 8px 12px !important;
            }

            /* Panneau événements */
            .lg\\:sticky.lg\\:top-28 {
                position: static !important;
                top: auto !important;
            }

            .event-item {
                padding: 10px;
                font-size: 13px;
                margin-bottom: 6px;
            }

            /* Boutons */
            button {
                padding: 8px 12px;
                font-size: 13px;
                border-radius: 6px;
            }

            /* Navigation */
            nav {
                padding: 12px 16px !important;
            }

            .font-bold.tracking-widest {
                font-size: 12px !important;
            }

            /* Header pour la navigation mois/année */
            .flex.items-center.justify-between {
                flex-wrap: wrap;
                gap: 8px;
            }

            .view-toggle {
                width: 100%;
                gap: 4px;
            }

            .view-toggle button {
                font-size: 11px;
                padding: 4px 8px;
                flex: 1;
            }

            /* Gap et spacing */
            .gap-6 {
                gap: 8px !important;
            }

            .gap-4 {
                gap: 8px !important;
            }

            .mb-8 {
                margin-bottom: 12px !important;
            }

            .mb-4 {
                margin-bottom: 8px !important;
            }

            .mb-2 {
                margin-bottom: 4px !important;
            }

            .p-8 {
                padding: 12px !important;
            }

            .p-6 {
                padding: 12px !important;
            }

            .px-6 {
                padding-left: 8px !important;
                padding-right: 8px !important;
            }

            .py-4 {
                padding-top: 8px !important;
                padding-bottom: 8px !important;
            }

            /* En-têtes de section */
            .text-4xl {
                font-size: 24px !important;
            }

            .text-2xl {
                font-size: 18px !important;
            }

            .text-lg {
                font-size: 15px !important;
            }

            .text-sm {
                font-size: 12px !important;
            }

            .text-xs {
                font-size: 10px !important;
            }

            /* Flexbox pour les petits écrans */
            .flex.flex-col.md\\:flex-row {
                flex-direction: column;
            }

            .flex.gap-3 {
                gap: 6px !important;
                flex-direction: column;
            }

            .flex.gap-3 button {
                width: 100%;
            }

            /* Input time sur mobile */
            input[type="time"],
            input[type="date"] {
                font-size: 16px; /* Évite le zoom sur iOS */
            }

            /* Fix pour le gap sur les inputs */
            .flex.items-center.gap-2 {
                gap: 8px;
            }

            /* Affichage sur très petits écrans */
        }

        @media (max-width: 375px) {
            .modal {
                width: 98%;
                padding: 12px;
            }

            .text-sm {
                font-size: 11px !important;
            }

            .text-xs {
                font-size: 9px !important;
            }

            h1 {
                font-size: 22px !important;
            }

            .view-toggle button {
                font-size: 10px;
                padding: 3px 6px;
            }

            .calendar-day {
                padding: 3px;
                font-size: 10px;
            }

            .event-tag {
                font-size: 8px;
                padding: 0.5px 3px;
            }
        }
    </style>
</head>
<body class="antialiased selection:bg-gray-200">

    <main class="pt-24 pb-20 px-4 md:px-6 max-w-6xl mx-auto">

            <h1 class="text-4xl font-bold mb-2">Agenda partagé</h1>

        <!-- Conteneur principal -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            
            <!-- Calendrier principal -->
            <div class="lg:col-span-3">
                <div class="bg-white rounded-2xl shadow-lg p-8 overflow-x-auto">

                    <div class="flex items-center justify-between mb-8 flex-wrap gap-4">
                        <button id="prev-month" class="p-2 hover:bg-gray-100 rounded-lg transition shrink-0">

                        <div class="week-day-header">Jeu</div>

    <!-- Modal pour ajouter/modifier un événement -->

    <script>
        // Configuration Supabase
        const SUPABASE_URL = 'https://vycloqcfpqhmzanjmhat.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ5Y2xvcWNmcHFobXphbmptaGF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MjE1NjAsImV4cCI6MjEwMjE5NzU2MH0.liLskwIeSwEzRpYsfZOAPVkpN1Ruv53iE1Kz0LY3YHw';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // État du calendrier
        let currentDate = new Date();
        let currentView = 'month'; // 'month' ou 'week'
        let events = [];
        let selectedEvent = null;
        let isLoading = false;

        // Charger les événements au démarrage
        async function initializeCalendar() {
            isLoading = true;
            await loadEventsFromSupabase();
            renderCalendar();
            renderEventsList();
            setupRealtimeListener();
            isLoading = false;
        }

        // Charger les événements depuis Supabase
        async function loadEventsFromSupabase() {
            try {
                const { data, error } = await supabase
                    .from('events')
                    .select('*')
                    .order('date', { ascending: true });
                
                if (error) throw error;
                events = data || [];
            } catch (err) {
                console.error('Erreur lors du chargement des événements:', err);
                events = [];
            }
        }

        // Écouter les changements en temps réel
        function setupRealtimeListener() {
            const subscription = supabase
                .channel('events_changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'events' }, async (payload) => {
                    console.log('Changement détecté:', payload);
                    await loadEventsFromSupabase();
                    renderCalendar();
                    renderEventsList();
                })
                .subscribe();
        }

        // Initialisation
        initializeCalendar();

        // Gestion de la case "Jour entier"
        document.getElementById('event-all-day').addEventListener('change', (e) => {
            const timeFields = document.getElementById('time-fields');
            if (e.target.checked) {
                timeFields.style.display = 'none';
                document.getElementById('event-start-time').value = '';
                document.getElementById('event-end-time').value = '';
            } else {
                timeFields.style.display = 'block';
            }
        });

        // Navigation
        document.getElementById('prev-month').addEventListener('click', () => {
            if (currentView === 'month') {
                currentDate.setMonth(currentDate.getMonth() - 1);
            } else {
                currentDate.setDate(currentDate.getDate() - 7);
            }
            renderCalendar();
        });

        document.getElementById('next-month').addEventListener('click', () => {
            if (currentView === 'month') {
                currentDate.setMonth(currentDate.getMonth() + 1);
            } else {
                currentDate.setDate(currentDate.getDate() + 7);
            }
            renderCalendar();
        });

        // Basculement de vue
        document.getElementById('view-month').addEventListener('click', () => {
            currentView = 'month';
            document.getElementById('view-month').classList.add('active');
            document.getElementById('view-week').classList.remove('active');
            renderCalendar();
        });

        document.getElementById('view-week').addEventListener('click', () => {
            currentView = 'week';
            document.getElementById('view-week').classList.add('active');
            document.getElementById('view-month').classList.remove('active');
            renderCalendar();
        });

        // Modales
        document.getElementById('add-event-btn').addEventListener('click', openNewEventModal);
        document.getElementById('close-modal').addEventListener('click', closeModal);
        document.getElementById('modal-cancel').addEventListener('click', closeModal);
        document.getElementById('modal-backdrop').addEventListener('click', closeModal);
        document.getElementById('event-form').addEventListener('submit', saveEvent);

        // Menu mobile
        document.getElementById('mobile-menu-btn').addEventListener('click', () => {
            const menu = document.getElementById('mobile-menu');
            const hamburger = document.getElementById('hamburger-icon');
            const close = document.getElementById('close-icon');
            menu.classList.toggle('hidden');
            hamburger.classList.toggle('hidden');
            close.classList.toggle('hidden');
        });

        function renderCalendar() {
            if (currentView === 'month') {
                renderMonthView();
            } else {
                renderWeekView();
            }
        }

        function renderMonthView() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            // Mise à jour du titre
            const monthNames = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
            document.getElementById('month-year').textContent = `${monthNames[month]} ${year}`;

            // Premier jour du mois et nombre de jours
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();

            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            grid.className = 'calendar-grid';

            // Jours du mois précédent
            for (let i = firstDay === 0 ? 6 : firstDay - 1; i > 0; i--) {
                const day = daysInPrevMonth - i + 1;
                createDayElement(grid, day, true, new Date(year, month - 1, day));
            }

            // Jours du mois actuel
            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(year, month, day);
                createDayElement(grid, day, false, date);
            }

            // Jours du mois suivant
            const remainingDays = 42 - grid.children.length;
            for (let day = 1; day <= remainingDays; day++) {
                createDayElement(grid, day, true, new Date(year, month + 1, day));
            }
        }

        function renderWeekView() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            // Trouver le lundi de la semaine
            const day = currentDate.getDay();
            const diff = currentDate.getDate() - day + (day === 0 ? -6 : 1);
            const mondayDate = new Date(year, month, diff);

            // Mise à jour du titre
            const endDate = new Date(mondayDate);
            endDate.setDate(endDate.getDate() + 6);
            const monthNames = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
            const startMonth = monthNames[mondayDate.getMonth()];
            const endMonth = monthNames[endDate.getMonth()];
            document.getElementById('month-year').textContent = `${startMonth} ${mondayDate.getDate()} - ${endMonth} ${endDate.getDate()}`;

            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            grid.className = 'calendar-grid';
            
            // En-têtes des jours
            const dayNames = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
            for (let i = 0; i < 7; i++) {
                const headerCell = document.createElement('div');
                headerCell.className = 'week-day-header';
                const dayDate = new Date(mondayDate);
                dayDate.setDate(dayDate.getDate() + i);
                headerCell.textContent = `${dayNames[i]} ${dayDate.getDate()}`;
                grid.appendChild(headerCell);
            }

            // Jours de la semaine
            for (let i = 0; i < 7; i++) {
                const dayDate = new Date(mondayDate);
                dayDate.setDate(dayDate.getDate() + i);
                const dateStr = dayDate.toISOString().split('T')[0];
                createWeekDayElement(grid, dayDate, dateStr);
            }
        }

        function createDayElement(grid, day, isOtherMonth, dateObj) {
            const dayElement = document.createElement('div');
            dayElement.className = 'calendar-day';
            
            const dateStr = dateObj.toISOString().split('T')[0];
            const dayEvents = getEventsForDate(dateStr);
            const isToday = dateObj.toDateString() === new Date().toDateString();

            if (isOtherMonth) {
                dayElement.classList.add('other-month');
            }
            if (isToday) {
                dayElement.classList.add('today');
            }

            dayElement.innerHTML = `<div class="day-number">${day}</div>`;
            
            if (dayEvents.length > 0) {
                const eventList = dayEvents.map(e => `<div class="event-tag" title="${e.author}: ${e.title}">${e.author}: ${e.title}</div>`).join('');
                dayElement.innerHTML += `<div class="event-indicator" style="font-size: 11px; line-height: 1.2;">${eventList}</div>`;
            }

            dayElement.addEventListener('click', () => openDayEvents(dateStr, dateObj));
            grid.appendChild(dayElement);
        }

        function createWeekDayElement(grid, dayDate, dateStr) {
            const dayElement = document.createElement('div');
            dayElement.className = 'calendar-day-week';
            
            const dayEvents = getEventsForDate(dateStr);
            const isToday = dayDate.toDateString() === new Date().toDateString();
            const isOtherMonth = dayDate.getMonth() !== currentDate.getMonth();

            if (isOtherMonth) {
                dayElement.classList.add('other-month');
            }
            if (isToday) {
                dayElement.classList.add('today');
            }

            let html = `<div class="day-number" style="font-size: 12px; margin-bottom: 4px; font-weight: 600;">${dayDate.getDate()}</div>`;
            
            if (dayEvents.length > 0) {
                dayEvents.forEach(e => {
                    const isMultiDay = e.end_date && e.end_date !== e.date;
                    html += `<div class="event-tag ${isMultiDay ? 'multi-day' : ''}" title="${e.author}: ${e.title}">${e.author}: ${e.title}</div>`;
                });
            }

            dayElement.innerHTML = html;
            dayElement.addEventListener('click', () => openDayEvents(dateStr, dayDate));
            grid.appendChild(dayElement);
        }

        function getEventsForDate(dateStr) {
            return events.filter(e => {
                const eventStart = e.date;
                const eventEnd = e.end_date || e.date;
                return dateStr >= eventStart && dateStr <= eventEnd;
            });
        }

        function renderEventsList() {
            const today = new Date().toISOString().split('T')[0];
            const upcomingEvents = events.filter(e => e.date >= today).sort((a, b) => new Date(a.date) - new Date(b.date));
            
            const list = document.getElementById('events-list');
            list.innerHTML = '';

            if (upcomingEvents.length === 0) {
                list.innerHTML = '<p class="text-gray-500 text-sm text-center py-4">Aucun événement</p>';
                return;
            }

            upcomingEvents.forEach(event => {
                const eventEl = document.createElement('div');
                eventEl.className = `event-item type-${event.type}`;
                const eventDate = new Date(event.date);
                const dateStr = eventDate.toLocaleDateString('fr-FR', { weekday: 'short', month: 'short', day: 'numeric' });
                
                let dateRange = dateStr;
                if (event.end_date && event.end_date !== event.date) {
                    const endDate = new Date(event.end_date);
                    const endDateStr = endDate.toLocaleDateString('fr-FR', { weekday: 'short', month: 'short', day: 'numeric' });
                    dateRange = `${dateStr} → ${endDateStr}`;
                }
                
                // Affichage de l'heure
                let timeDisplay = '';
                if (!event.all_day && event.start_time) {
                    timeDisplay = event.start_time;
                    if (event.end_time) {
                        timeDisplay += ` - ${event.end_time}`;
                    }
                }
                
                eventEl.innerHTML = `
                    <div>
                        <div class="font-semibold text-sm">${event.title}</div>
                        <div class="text-xs text-gray-500">${event.author} · ${dateRange}${timeDisplay ? ' · ' + timeDisplay : ''}</div>
                    </div>
                    <button class="text-gray-400 hover:text-gray-600 edit-btn" data-id="${event.id}">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                        </svg>
                    </button>
                `;

                eventEl.querySelector('.edit-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    const eventToEdit = events.find(ev => ev.id === parseInt(event.id));
                    openEventModal(eventToEdit);
                });

                list.appendChild(eventEl);
            });
        }

        function openDayEvents(dateStr, dateObj) {
            const dayEvents = getEventsForDate(dateStr);
            const dateStr_formatted = dateObj.toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            
            const list = document.getElementById('events-list');
            list.innerHTML = '';

            const header = document.createElement('div');
            header.className = 'mb-4 pb-4 border-b';
            header.innerHTML = `<h4 class="font-semibold text-gray-700">${dateStr_formatted}</h4>`;
            list.appendChild(header);

            if (dayEvents.length === 0) {
                list.innerHTML += '<p class="text-gray-500 text-sm">Aucun événement</p>';
            } else {
                dayEvents.forEach(event => {
                    const eventEl = document.createElement('div');
                    eventEl.className = `event-item type-${event.type} cursor-pointer`;
                    
                    let timeDisplay = '';
                    if (!event.all_day && event.start_time) {
                        timeDisplay = event.start_time;
                        if (event.end_time) {
                            timeDisplay += ` - ${event.end_time}`;
                        }
                    }
                    
                    let eventInfo = `<div class="font-semibold text-sm">${event.title}</div>
                        <div class="text-xs text-gray-500">Par ${event.author}${timeDisplay ? ' · ' + timeDisplay : ''}</div>`;
                    if (event.description) {
                        eventInfo += `<div class="text-xs text-gray-500 mt-1">${event.description}</div>`;
                    }
                    
                    eventEl.innerHTML = `
                        <div class="flex-1">
                            ${eventInfo}
                        </div>
                        <button class="text-gray-400 hover:text-gray-600 edit-btn" data-id="${event.id}">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                            </svg>
                        </button>
                    `;
                    eventEl.querySelector('.edit-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        const eventToEdit = events.find(ev => ev.id === parseInt(event.id));
                        openEventModal(eventToEdit);
                    });
                    list.appendChild(eventEl);
                });
            }

            const addBtn = document.createElement('button');
            addBtn.className = 'w-full mt-4 bg-blue-500 text-white py-2 rounded-lg font-semibold hover:bg-blue-600 transition flex items-center justify-center gap-2';
            addBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg> Ajouter';
            addBtn.addEventListener('click', () => openNewEventModal(dateStr));
            list.appendChild(addBtn);
        }

        function openNewEventModal(dateStr) {
            selectedEvent = null;
            document.getElementById('modal-title').textContent = 'Nouvel événement';
            document.getElementById('event-form').reset();
            document.getElementById('event-all-day').checked = true;
            document.getElementById('time-fields').style.display = 'none';
            document.getElementById('delete-event-btn').classList.add('hidden');
            if (dateStr) {
                document.getElementById('event-date').value = dateStr;
            }
            document.getElementById('event-modal').classList.add('active');
            document.getElementById('modal-backdrop').classList.add('active');
            document.body.classList.add('modal-open');
        }

        function openEventModal(event) {
            selectedEvent = event;
            document.getElementById('modal-title').textContent = 'Modifier l\'événement';
            document.getElementById('event-title').value = event.title;
            document.getElementById('event-author').value = event.author || '';
            document.getElementById('event-date').value = event.date;
            document.getElementById('event-end-date').value = event.end_date || '';
            document.getElementById('event-all-day').checked = event.all_day || false;
            document.getElementById('event-start-time').value = event.start_time || '';
            document.getElementById('event-end-time').value = event.end_time || '';
            
            // Afficher/masquer les champs de temps
            const timeFields = document.getElementById('time-fields');
            if (event.all_day) {
                timeFields.style.display = 'none';
            } else {
                timeFields.style.display = 'block';
            }
            
            document.getElementById('event-type').value = event.type;
            document.getElementById('event-desc').value = event.description || '';
            document.getElementById('delete-event-btn').classList.remove('hidden');
            document.getElementById('event-modal').classList.add('active');
            document.getElementById('modal-backdrop').classList.add('active');
            document.body.classList.add('modal-open');
        }

        function closeModal() {
            document.getElementById('event-modal').classList.remove('active');
            document.getElementById('modal-backdrop').classList.remove('active');
            document.body.classList.remove('modal-open');
            selectedEvent = null;
        }

        function saveEvent(e) {
            e.preventDefault();
            const title = document.getElementById('event-title').value;
            const author = document.getElementById('event-author').value;
            const date = document.getElementById('event-date').value;
            const endDate = document.getElementById('event-end-date').value;
            const allDay = document.getElementById('event-all-day').checked;
            const startTime = document.getElementById('event-start-time').value;
            const endTime = document.getElementById('event-end-time').value;
            const type = document.getElementById('event-type').value;
            const desc = document.getElementById('event-desc').value;

            if (selectedEvent) {
                // Modification
                updateEventInSupabase({
                    id: selectedEvent.id,
                    title,
                    author,
                    date,
                    end_date: endDate || null,
                    all_day: allDay,
                    start_time: allDay ? null : (startTime || null),
                    end_time: allDay ? null : (endTime || null),
                    type,
                    description: desc
                });
            } else {
                // Création
                createEventInSupabase({
                    title,
                    author,
                    date,
                    end_date: endDate || null,
                    all_day: allDay,
                    start_time: allDay ? null : (startTime || null),
                    end_time: allDay ? null : (endTime || null),
                    type,
                    description: desc
                });
            }
        }

        // Créer un événement dans Supabase
        async function createEventInSupabase(eventData) {
            try {
                const { error } = await supabase
                    .from('events')
                    .insert([eventData]);
                
                if (error) throw error;
                closeModal();
                await loadEventsFromSupabase();
                renderCalendar();
                renderEventsList();
            } catch (err) {
                console.error('Erreur lors de la création:', err);
                alert('Erreur lors de la création de l\'événement');
            }
        }

        // Mettre à jour un événement dans Supabase
        async function updateEventInSupabase(eventData) {
            try {
                const { error } = await supabase
                    .from('events')
                    .update(eventData)
                    .eq('id', eventData.id);
                
                if (error) throw error;
                closeModal();
                await loadEventsFromSupabase();
                renderCalendar();
                renderEventsList();
            } catch (err) {
                console.error('Erreur lors de la mise à jour:', err);
                alert('Erreur lors de la mise à jour de l\'événement');
            }
        }

        document.getElementById('delete-event-btn').addEventListener('click', () => {
            if (selectedEvent && confirm('Êtes-vous sûr de vouloir supprimer cet événement ?')) {
                deleteEventFromSupabase(selectedEvent.id);
            }
        });

        // Supprimer un événement de Supabase
        async function deleteEventFromSupabase(eventId) {
            try {
                const { error } = await supabase
                    .from('events')
                    .delete()
                    .eq('id', eventId);
                
                if (error) throw error;
                closeModal();
                await loadEventsFromSupabase();
                renderCalendar();
                renderEventsList();
            } catch (err) {
                console.error('Erreur lors de la suppression:', err);
                alert('Erreur lors de la suppression de l\'événement');
            }
        }
    </script>
</body>
</html>
